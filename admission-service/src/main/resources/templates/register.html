<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Admission Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="navbar">
        <a th:href="@{/}" class="nav-brand">🎓 Admission Portal</a>
        <div class="nav-links">
            <a th:href="@{/track}" class="nav-link">🔍 Track Application</a>
            <a th:href="@{/login}" class="btn btn-secondary btn-sm">Sign In</a>
        </div>
    </header>

    <main class="container" style="max-width: 860px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 1.85rem; color: var(--dark);">Student Admission Application</h1>
            <p style="color: var(--text-muted);">Fill in your details below to register your account and generate your Application Number</p>
        </div>

        <div class="card">
            <form th:action="@{/register}" th:object="${registrationDto}" method="post">
                
                <h3 style="font-size: 1.1rem; color: var(--primary); margin-bottom: 1.25rem; border-bottom: 2px solid var(--primary-light); padding-bottom: 0.5rem;">
                    1. Account Credentials
                </h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="username">Username *</label>
                        <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="Choose a username" required>
                        <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password *</label>
                        <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="At least 6 characters" required>
                        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>
                </div>

                <h3 style="font-size: 1.1rem; color: var(--primary); margin: 1.5rem 0 1.25rem; border-bottom: 2px solid var(--primary-light); padding-bottom: 0.5rem;">
                    2. Personal Details
                </h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="fullName">Full Name *</label>
                        <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="e.g. John Doe" required>
                        <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email Address *</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="john@example.com" required>
                        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="phone">Phone Number *</label>
                        <input type="tel" id="phone" th:field="*{phone}" class="form-control" placeholder="10-digit mobile number" required>
                        <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="dateOfBirth">Date of Birth *</label>
                        <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" class="form-control" required>
                        <span class="field-error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="gender">Gender *</label>
                        <select id="gender" th:field="*{gender}" class="form-control" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                        <span class="field-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
                    </div>

                    <div class="form-group full-width">
                        <label class="form-label" for="address">Residential Address *</label>
                        <textarea id="address" th:field="*{address}" class="form-control" rows="2" placeholder="Street, City, Postal Code" required></textarea>
                        <span class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                    </div>
                </div>

                <h3 style="font-size: 1.1rem; color: var(--primary); margin: 1.5rem 0 1.25rem; border-bottom: 2px solid var(--primary-light); padding-bottom: 0.5rem;">
                    3. Academic Information
                </h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="appliedClass">Applying for Class *</label>
                        <select id="appliedClass" th:field="*{appliedClass}" class="form-control" required>
                            <option value="">Select Target Class</option>
                            <option value="Class 1">Class 1</option>
                            <option value="Class 2">Class 2</option>
                            <option value="Class 3">Class 3</option>
                            <option value="Class 4">Class 4</option>
                            <option value="Class 5">Class 5</option>
                            <option value="Class 6">Class 6</option>
                            <option value="Class 7">Class 7</option>
                            <option value="Class 8">Class 8</option>
                            <option value="Class 9">Class 9</option>
                            <option value="Class 10">Class 10</option>
                            <option value="Class 11 Science">Class 11 - Science</option>
                            <option value="Class 11 Commerce">Class 11 - Commerce</option>
                            <option value="Class 11 Arts">Class 11 - Arts</option>
                            <option value="Class 12 Science">Class 12 - Science</option>
                            <option value="Class 12 Commerce">Class 12 - Commerce</option>
                            <option value="Class 12 Arts">Class 12 - Arts</option>
                        </select>
                        <span class="field-error" th:if="${#fields.hasErrors('appliedClass')}" th:errors="*{appliedClass}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="previousSchool">Previous School Name</label>
                        <input type="text" id="previousSchool" th:field="*{previousSchool}" class="form-control" placeholder="e.g. St. Peters School">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="marksPercentage">Previous Qualifying Marks (%)</label>
                        <input type="number" step="0.1" min="0" max="100" id="marksPercentage" th:field="*{marksPercentage}" class="form-control" placeholder="e.g. 85.5">
                        <span class="field-error" th:if="${#fields.hasErrors('marksPercentage')}" th:errors="*{marksPercentage}"></span>
                    </div>
                </div>

                <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: flex-end;">
                    <a th:href="@{/login}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Submit Application & Register</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        &copy; 2026 Admission Management System.
    </footer>
</body>
</html>
